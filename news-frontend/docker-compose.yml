version: '3.8'

services:
  news-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    volumes:
      # Mount nginx config for development
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - news-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add backend service if you want to run both together
  # news-backend:
  #   image: your-backend-image:latest
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=your-database-url
  #   networks:
  #     - news-network
  #   depends_on:
  #     - news-frontend

networks:
  news-network:
    driver: bridge

volumes:
  nginx-cache:
    driver: local

