<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Central Square (I) - Light Green -->
  <rect x="35" y="35" width="30" height="30" fill="#90EE90" stroke="none"/>
  <text x="50" y="52" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">I</text>
  
  <!-- Top Rectangle (O) - Red -->
  <rect x="35" y="15" width="30" height="20" fill="#FF0000" stroke="none"/>
  <text x="50" y="27" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">O</text>
  
  <!-- Bottom Rectangle (N) - Red -->
  <rect x="35" y="65" width="30" height="20" fill="#FF0000" stroke="none"/>
  <text x="50" y="77" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">N</text>
  
  <!-- Left Rectangle (T) - Yellow -->
  <rect x="15" y="35" width="20" height="30" fill="#FFFF00" stroke="none"/>
  <text x="27" y="52" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">T</text>
  
  <!-- Right Rectangle (G) - Yellow -->
  <rect x="65" y="35" width="20" height="30" fill="#FFFF00" stroke="none"/>
  <text x="77" y="52" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">G</text>
  
  <!-- Top-Left Triangle (C) - Blue -->
  <polygon points="15,15 35,15 35,35" fill="#0000FF" stroke="none"/>
  <text x="23" y="23" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">C</text>
  
  <!-- Top-Right Triangle (L) - Blue -->
  <polygon points="65,15 85,15 65,35" fill="#0000FF" stroke="none"/>
  <text x="77" y="23" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">L</text>
  
  <!-- Bottom-Left Triangle (E) - Blue -->
  <polygon points="15,65 35,65 35,85" fill="#0000FF" stroke="none"/>
  <text x="23" y="77" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">E</text>
  
  <!-- Bottom-Right Triangle (T) - Blue -->
  <polygon points="65,65 85,65 65,85" fill="#0000FF" stroke="none"/>
  <text x="77" y="77" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">T</text>
</svg>
